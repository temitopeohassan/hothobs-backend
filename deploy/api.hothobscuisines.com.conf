# OpenResty / nginx vhost for the Hothobs API.
# Put the TLS certificate in place with certbot first, then reload.

server {
    listen 80;
    listen [::]:80;
    server_name api.hothobscuisines.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.hothobscuisines.com;

    ssl_certificate     /etc/letsencrypt/live/api.hothobscuisines.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hothobscuisines.com/privkey.pem;

    # express.json and the Paystack webhook both cap at 256kb; leave headroom.
    client_max_body_size 1m;

    access_log /var/log/nginx/hothobs-api.access.log;
    error_log  /var/log/nginx/hothobs-api.error.log;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # X-Forwarded-Proto is what `app.set('trust proxy', 1)` reads to decide
        # the connection is HTTPS, which is what lets Express send a Secure cookie.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # Do NOT add add_header Access-Control-Allow-Origin here. Express already
        # sets it (src/server.js). Two sources produce a duplicated header, which
        # browsers reject outright with "contains multiple values".
    }
}
